<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Performance Dashboard</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.min.js"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 30px 20px;
      min-height: 100vh;
    }

    .dashboard-container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Tab Navigation */
    .tab-navigation {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Level Progress Card */
    .progress-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .progress-percentage {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #38bdf8, #34d399);
      border-radius: 5px;
      transition: width 1s ease-in-out;
    }

    .progress-subtext {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Detail Table */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }

    .table-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      padding: 14px;
      font-size: 0.85rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    tr:hover td {
      background: var(--bg-card-hover);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Top Header -->
    <div class="header">
      <h1>Performance Executive Dashboard</h1>
      <div class="live-status">
        <span class="pulse-dot"></span>
        <span id="update-timer">Realtime Sync Active</span>
      </div>
    </div>

    <!-- Store Switcher Tabs -->
    <div class="tab-navigation">
      <button class="tab-btn active" onclick="switchStore('toko1')">Toko 1</button>
      <button class="tab-btn" onclick="switchStore('toko2')">Toko 2</button>
    </div>

    <!-- MTD Performance Cards -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">MTD Volume / Omzet</div>
        <div class="kpi-value" id="mtd-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Pencapaian Level Saat Ini</div>
        <div class="kpi-value" id="current-level">Level 1</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Total Baris / Transaksi MTD</div>
        <div class="kpi-value" id="total-rows">0</div>
      </div>
    </div>

    <!-- Progress Capaian Level -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-title">Progres Pencapaian Level Periode Berjalan</span>
        <span class="progress-percentage" id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-subtext" id="progress-desc">Memproses akumulasi data MTD...</div>
    </div>

    <!-- Raw Data View -->
    <div class="table-container">
      <div class="table-title">Rincian Data Periode Berjalan</div>
      <table id="dynamic-table">
        <thead>
          <tr id="table-head"><th>Memuat kolom...</th></tr>
        </thead>
        <tbody id="table-body">
          <tr><td>Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const STORES = {
      toko1: {
        name: "Toko 1",
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh-l9QcJ-DnOQi2F7BAwZgxze1DU06fIg7AZSQea7Yd_mPyK3H25G4ZITeoaXSKDqeqlGFP_ky4AXo/pub?output=csv",
        data: []
      },
      toko2: {
        name: "Toko 2",
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS8hUPEdunze_A9dVRnCIdaC26cXnYYMs_qOTxXE2OKF2xP8YhzqsT-dJPsuVfJaoraJQVnaS58sNzV/pub?output=csv",
        data: []
      }
    };

    let activeStoreKey = 'toko1';

    function switchStore(storeKey) {
      activeStoreKey = storeKey;
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (index === 0 && storeKey === 'toko1') || (index === 1 && storeKey === 'toko2'));
      });
      renderDashboard();
    }

    function fetchAllData() {
      let completed = 0;
      Object.keys(STORES).forEach(key => {
        Papa.parse(STORES[key].url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            STORES[key].data = results.data;
            completed++;
            if (completed === Object.keys(STORES).length) {
              renderDashboard();
              document.getElementById('update-timer').innerText = "Updated: " + new Date().toLocaleTimeString();
            }
          }
        });
      });
    }

    function renderDashboard() {
      const currentData = STORES[activeStoreKey].data;
      if (!currentData || currentData.length === 0) return;

      // 1. Render Hitungan MTD & Total Transaksi
      document.getElementById('total-rows').innerText = currentData.length.toLocaleString('id-ID');

      // Mencoba mencari kolom numerik otomatis untuk kalkulasi MTD
      let sum = 0;
      const keys = Object.keys(currentData[0]);
      const numericKey = keys.find(k => k.toLowerCase().includes('omset') || k.toLowerCase().includes('total') || k.toLowerCase().includes('jumlah') || k.toLowerCase().includes('harga') || k.toLowerCase().includes('nominal'));

      if (numericKey) {
        sum = currentData.reduce((acc, row) => {
          let val = parseFloat((row[numericKey] || '').toString().replace(/[^0-9.-]+/g, ""));
          return acc + (isNaN(val) ? 0 : val);
        }, 0);
        document.getElementById('mtd-value').innerText = sum.toLocaleString('id-ID');
      } else {
        document.getElementById('mtd-value').innerText = currentData.length.toLocaleString('id-ID') + " Transaksi";
      }

      // 2. Kalkulasi Capaian Level (Dinamis Berdasarkan Jumlah Data / Volume)
      // Pengaturan Target (Dapat disesuaikan sesuai indikator bisnis Anda)
      const targetLevel2 = 50; 
      const targetLevel3 = 100;
      let currentScore = numericKey ? sum : currentData.length;
      
      let levelText = "Level 1";
      let progressPercent = 0;
      let progressDesc = "";

      if (currentScore < targetLevel2) {
        levelText = "Level 1";
        progressPercent = Math.min(Math.round((currentScore / targetLevel2) * 100), 100);
        progressDesc = `Butuh ${targetLevel2 - currentScore} poin/transaksi lagi menuju Level 2`;
      } else if (currentScore < targetLevel3) {
        levelText = "Level 2";
        progressPercent = Math.min(Math.round(((currentScore - targetLevel2) / (targetLevel3 - targetLevel2)) * 100), 100);
        progressDesc = `Selamat! Anda di Level 2. Butuh ${targetLevel3 - currentScore} poin lagi menuju Level 3`;
      } else {
        levelText = "Level 3 (Max Level)";
        progressPercent = 100;
        progressDesc = "Luar biasa! Target pencapaian level tertinggi periode ini telah tercapai.";
      }

      document.getElementById('current-level').innerText = levelText;
      document.getElementById('progress-percent').innerText = progressPercent + "%";
      document.getElementById('progress-fill').style.width = progressPercent + "%";
      document.getElementById('progress-desc').innerText = progressDesc;

      // 3. Render Tabel Detail
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      
      thead.innerHTML = keys.map(k => `<th>${k}</th>`).join('');
      tbody.innerHTML = currentData.map(row => {
        return `<tr>${keys.map(k => `<td>${row[k] || '-'}</td>`).join('')}</tr>`;
      }).join('');
    }

    // Inisialisasi awal dan Auto Update tiap 10 detik
    fetchAllData();
    setInterval(fetchAllData, 10000);
  </script>
</body>
</html>
