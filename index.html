<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Performa Eksekutif</title>

  <!-- Google Fonts & PapaParse -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #334155;
      padding-bottom: 40px;
    }

    /* Navbar / Header Purple (Sesuai Referensi) */
    .top-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
    }

    .brand-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-guest {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 30px auto 0 auto;
      padding: 0 20px;
    }

    /* Overall Summary Cards */
    .summary-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 15px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .kpi-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
    }

    .kpi-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .icon-pink { background: #fce7f3; color: #ec4899; }
    .icon-purple { background: #f3e8ff; color: #a855f7; }

    .kpi-info .kpi-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .kpi-info .kpi-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* Progress Cards (Per Toko) */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 24px;
    }

    .store-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      transition: transform 0.2s ease;
    }

    .store-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .store-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .store-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: #1e293b;
    }

    .store-stats {
      display: flex;
      gap: 15px;
    }

    .stat-badge {
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    /* Custom Progress Bar */
    .progress-section {
      margin-top: 20px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .current-level {
      color: #6366f1;
    }

    .target-level {
      color: #94a3b8;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
      border-radius: 10px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-desc {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }

    .level-achieved {
      color: #10b981 !important;
    }
    
    @media (max-width: 768px) {
      .kpi-grid, .store-grid { grid-template-columns: 1fr; }
      .top-header { flex-direction: column; gap: 15px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="top-header">
    <div class="brand-title">
      <h1>📊 Dashboard Executive Sales</h1>
      <div class="brand-subtitle">
        Monitoring Capaian Level Eksekutif 
        <span class="badge-guest">Live</span> • 
        <span id="current-timestamp">Memuat Waktu...</span>
      </div>
    </div>
  </header>

  <div class="container">
    
    <div class="summary-title">Summary Keseluruhan (Bulan Berjalan)</div>
    
    <!-- Top KPI Level (Gabungan) -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon icon-pink">🛍️</div>
        <div class="kpi-info">
          <div class="kpi-label">Total Penjualan (Qty)</div>
          <div class="kpi-value" id="grand-qty">0</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon icon-purple">💳</div>
        <div class="kpi-info">
          <div class="kpi-label">Total Transaksi</div>
          <div class="kpi-value" id="grand-trx">0</div>
        </div>
      </div>
    </div>

    <div class="summary-title">Progress Capaian Level Per Toko</div>
    
    <!-- Area Card Tiap Toko (Digenerate oleh JS) -->
    <div class="store-grid" id="store-container">
      <!-- Loading Placeholder -->
      <div style="color: #64748b; font-weight: 600;">Sinkronisasi data dari Google Sheets...</div>
    </div>

  </div>

  <script>
    // Konfigurasi Link Google Sheets Anda & Target Level (Misal: Target Lvl 1 = 100 Trx, Lvl 2 = 300 Trx, dsb)
    // Silakan sesuaikan targetPoints dengan indikator yang Anda pakai (apakah berdasarkan jumlah transaksi atau qty)
    const STORES_CONFIG = [
      { 
        name: "Toko 1", 
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh-l9QcJ-DnOQi2F7BAwZgxze1DU06fIg7AZSQea7Yd_mPyK3H25G4ZITeoaXSKDqeqlGFP_ky4AXo/pub?output=csv",
        targetLvl1: 50,
        targetLvl2: 150,
        targetLvl3: 300 
      },
      { 
        name: "Toko 2", 
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS8hUPEdunze_A9dVRnCIdaC26cXnYYMs_qOTxXE2OKF2xP8YhzqsT-dJPsuVfJaoraJQVnaS58sNzV/pub?output=csv",
        targetLvl1: 50,
        targetLvl2: 150,
        targetLvl3: 300 
      }
    ];

    // Live Jam
    function updateTimestamp() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('current-timestamp').innerText = `${now.toLocaleDateString('id-ID', options)} • ${now.toLocaleTimeString('id-ID')} WIB`;
    }
    setInterval(updateTimestamp, 1000);
    updateTimestamp();

    // Fungsi Fetch & Kalkulasi Data
    function loadData() {
      let fetchPromises = STORES_CONFIG.map(store => {
        return new Promise((resolve) => {
          Papa.parse(store.url, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              const data = results.data;
              
              let totalQty = 0;
              let totalTrx = data.length;

              // Coba cari kolom qty otomatis
              if (data.length > 0) {
                const keys = Object.keys(data[0]);
                const qtyKey = keys.find(k => k.toLowerCase().includes('qty') || k.toLowerCase().includes('jumlah'));
                if (qtyKey) {
                  totalQty = data.reduce((acc, row) => acc + (parseFloat(row[qtyKey]) || 0), 0);
                } else {
                  totalQty = totalTrx * 2; // Asumsi jika tidak ada kolom qty
                }
              }

              resolve({
                ...store,
                qty: totalQty,
                trx: totalTrx,
                score: totalTrx // Anggap capaian level berdasarkan total transaksi. (Ganti ke 'totalQty' jika berbasis sales qty)
              });
            }
          });
        });
      });

      Promise.all(fetchPromises).then(results => {
        renderDashboardUI(results);
      });
    }

    // Fungsi Render Tampilan Clean
    function renderDashboardUI(storeData) {
      let grandQty = 0;
      let grandTrx = 0;
      const container = document.getElementById('store-container');
      container.innerHTML = ''; // Clear container

      storeData.forEach(store => {
        grandQty += store.qty;
        grandTrx += store.trx;

        // Logika Leveling
        let currentLevel = 0;
        let nextTarget = store.targetLvl1;
        let progressPct = 0;
        let levelText = "Belum Mencapai Level";
        let nextLevelText = "Target: Level 1";
        let sisaTarget = 0;

        if (store.score >= store.targetLvl3) {
          currentLevel = 3;
          progressPct = 100;
          levelText = "🏆 Level 3 Achieved";
          nextLevelText = "Max Level";
          sisaTarget = 0;
        } else if (store.score >= store.targetLvl2) {
          currentLevel = 2;
          nextTarget = store.targetLvl3;
          progressPct = ((store.score - store.targetLvl2) / (store.targetLvl3 - store.targetLvl2)) * 100;
          levelText = "⭐ Level 2 Achieved";
          nextLevelText = "Target: Level 3";
          sisaTarget = nextTarget - store.score;
        } else if (store.score >= store.targetLvl1) {
          currentLevel = 1;
          nextTarget = store.targetLvl2;
          progressPct = ((store.score - store.targetLvl1) / (store.targetLvl2 - store.targetLvl1)) * 100;
          levelText = "🎯 Level 1 Achieved";
          nextLevelText = "Target: Level 2";
          sisaTarget = nextTarget - store.score;
        } else {
          progressPct = (store.score / store.targetLvl1) * 100;
          sisaTarget = store.targetLvl1 - store.score;
        }

        // HTML untuk Kartu Toko
        const cardHTML = `
          <div class="store-card">
            <div class="store-header">
              <div class="store-name">${store.name}</div>
              <div class="store-stats">
                <div class="stat-badge">Qty: ${store.qty.toLocaleString('id-ID')}</div>
                <div class="stat-badge">Trx: ${store.trx.toLocaleString('id-ID')}</div>
              </div>
            </div>

            <div class="progress-section">
              <div class="progress-labels">
                <span class="current-level ${currentLevel > 0 ? 'level-achieved' : ''}">${levelText}</span>
                <span class="target-level">${nextLevelText}</span>
              </div>
              
              <div class="progress-track">
                <div class="progress-fill" style="width: ${progressPct}%"></div>
              </div>

              <div class="progress-desc">
                ${sisaTarget > 0 
                  ? `Butuh <b>${Math.ceil(sisaTarget).toLocaleString('id-ID')}</b> transaksi lagi untuk naik level.` 
                  : `Target tertinggi periode ini telah tercapai!`}
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });

      // Update Angka Summary Atas
      document.getElementById('grand-qty').innerText = grandQty.toLocaleString('id-ID');
      document.getElementById('grand-trx').innerText = grandTrx.toLocaleString('id-ID');
    }

    // Jalankan & Auto Update 15 Detik
    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
